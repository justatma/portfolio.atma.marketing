name: Deploy to GoDaddy (FTPS)

# Ships the repo to its GoDaddy doc root on every push to main.
# The FTP account is chrooted to this site's doc root, so server-dir is ./.
#
# SAFETY: dangerous-clean-slate stays false. On growthbastards.com (main domain,
# doc root = /public_html) it must NEVER be enabled — cleaning would delete every
# sibling site nested inside /public_html.
#
# GoDaddy's FTP endpoint occasionally drops the control socket from GitHub runners,
# so the deploy runs with a longer timeout and an automatic single retry.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Refuse to ship a page that crawlers would read as blank. A design-tool bundle
      # rebuilds itself with JavaScript; GPTBot, ClaudeBot and most link previewers
      # never run it. Fix: website_ops/runbooks/after-a-design-export.md
      - name: Crawlability gate
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          skip = {"node_modules", "documents", "Documentation", "build"}
          bad = []
          for p in sorted(pathlib.Path(".").rglob("*.html")):
              if skip & set(p.parts) or any(part.startswith(".") for part in p.parts):
                  continue
              s = p.read_text(errors="ignore")
              head = s[: s.find("<body")] if "<body" in s else s
              if re.search(r'<meta[^>]*name="robots"[^>]*noindex', head):
                  continue
              if "__bundler/template" in s and 'id="__prerender"' not in s:
                  bad.append(f"  {p}: design bundle with no readable copy inside")
          if bad:
              print("These pages would reach crawlers as blank pages:")
              print("\n".join(bad))
              print("Run the converter: website_ops/runbooks/after-a-design-export.md")
              sys.exit(1)
          print("Crawlability gate: every indexable page has readable HTML.")
          PY

      # Refuse to ship the old team. On 2026-11-11 Journey Snowden and Vedant Tiwari
      # merged into Journey, AI Principal Developer/Engineer: fourteen AI specialists
      # plus Atma. A re-export from the design tool can bring the old copy back.
      # Fix the page (or the design) and push again. Decision: website_ops/DECISIONS.md
      - name: Team roster gate
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          skip = {"node_modules", "documents", "Documentation", "build", "archived_pages"}
          old = [
              r"vedant", r"tiwari", r"frontend engineer", r"backend engineer",
              r"if the browser can dream it",
              r"fifteen personas", r"fifteen agency roles", r"fifteen role types",
              r"fifteen ai specialists", r"fifteen specialist ai", r"fifteen ai colleagues",
              r"fifteen specialized experts", r"the fifteen specialists can do",
              r"meet the fifteen", r"the fifteen, and the engines",
              r"\b12-person team", r"hire 12 marketing specialists",
          ]
          pat = re.compile("|".join(old), re.I)
          bad = []
          for p in sorted(pathlib.Path(".").rglob("*")):
              if p.suffix not in {".html", ".md"} or p.name == "README.md":
                  continue
              if skip & set(p.parts) or any(part.startswith(".") for part in p.parts):
                  continue
              s = p.read_text(errors="ignore")
              for m in sorted({m.group(0).lower() for m in pat.finditer(s)}):
                  bad.append(f"  {p}: \"{m}\"")
          if bad:
              print("These pages still describe the old team (fifteen AI, Vedant, frontend/backend split):")
              print("\n".join(bad))
              print("The team is fourteen AI specialists plus Atma. See website_ops/DECISIONS.md, 2026-11-11.")
              sys.exit(1)
          print("Team roster gate: no old-team copy found.")
          PY

      - name: Deploy via FTPS
        id: deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          local-dir: ./
          dangerous-clean-slate: false
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            .gitignore
            README.md
            Documentation/**
            documents/**
            config.sample.php
            netlify.toml

      - name: Deploy via FTPS (retry on transient failure)
        if: steps.deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          local-dir: ./
          dangerous-clean-slate: false
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            .gitignore
            README.md
            Documentation/**
            documents/**
            config.sample.php
            netlify.toml
